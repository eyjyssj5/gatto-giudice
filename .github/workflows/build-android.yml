name: Compila APK Android di prova
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-android.yml"
      - "www/**"
      - "package.json"
      - "capacitor.config.json"
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # Il runner ubuntu-latest ha già Android SDK: evitiamo setup-android
      # che tenta di installare un pacchetto 'tools' ormai rimosso.
      - name: Verifica SDK Android esistente
        run: |
          echo "SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -5
      - name: Dipendenze Capacitor
        run: npm install --no-audit --no-fund
      - name: Genera shell Android e copia i file web
        run: |
          npx cap add android
          npx cap sync android
      - name: Crea APK debug NON firmato per Play Store
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gatto-giudice-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
