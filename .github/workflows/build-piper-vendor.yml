name: Crea libreria Piper locale
on:
  push:
    branches: [ripara-riproduzione-voce-iphone]
    paths: ['.github/workflows/build-piper-vendor.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ripara-riproduzione-voce-iphone
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa dipendenze esatte e browser bundle
        run: |
          npm install --no-audit --no-fund --no-save \
            @mintplex-labs/piper-tts-web@1.0.5 onnxruntime-web@1.24.1 esbuild@0.25.2
          npm ls @mintplex-labs/piper-tts-web onnxruntime-web esbuild --depth=0
      - name: Crea modulo ES per Safari e Chrome, senza shim esm.sh
        run: |
          mkdir -p www/vendor
          printf 'export * from "@mintplex-labs/piper-tts-web";\n' > piper-entry.mjs
          npx esbuild piper-entry.mjs \
            --bundle --platform=browser --format=esm --target=es2022 \
            --conditions=browser --minify \
            --outfile=www/vendor/piper.js
          ls -lh www/vendor/piper.js
      - name: Salva la libreria nella branch di sviluppo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/vendor/piper.js
          git diff --cached --quiet || git commit -m "Includi Piper e ONNX browser bundle verificabile"
          git push origin HEAD:ripara-riproduzione-voce-iphone
