name: Gatto Giudice V16 - Build AAB da ZIP
on:
  workflow_dispatch:
  push:
    branches:
      - play-commercial-v16
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Estrai sorgente definitivo V16
        run: |
          test -f GattoGiudice_PLAY_V16_SORGENTI_BUILD_AAB.zip
          mkdir app-source
          unzip -q GattoGiudice_PLAY_V16_SORGENTI_BUILD_AAB.zip -d app-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 36 (SDK già presente sul runner Ubuntu)
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E '(platforms;android-36|build-tools;36.0.0)'
      - name: Installa, prepara, controlla e compila
        working-directory: app-source
        run: |
          npm install --no-audit --no-fund
          npm run build:play
          npx cap add android
          npx cap sync android
          bash scripts/prepare-android-play.sh
          # Google Play Billing 8.3 richiede minSdkVersion >= 23.
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*22/minSdkVersion = 23/' android/variables.gradle
          grep 'minSdkVersion = 23' android/variables.gradle
          # Gradle vede mipmap-<density>-v4 e mipmap-<density> come risorse duplicate.
          # Mantieni le icone personalizzate, nella directory canonica generata da Capacitor.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source="android/app/src/main/res/mipmap-${density}-v4"
            target="android/app/src/main/res/mipmap-${density}"
            if [ -d "$source" ]; then
              mkdir -p "$target"
              cp -f "$source"/*.png "$target"/
              rm -rf "$source"
            fi
          done
          cd android
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon
      - name: Firma Google Play AAB
        working-directory: app-source
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.SIGNKEY }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.STOREPASS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.KEYPASS }}
          UPLOAD_ALIAS: ${{ secrets.KEYALIAS }}
        run: |
          set -euo pipefail
          : "${UPLOAD_KEYSTORE_B64:?Missing SIGNKEY}"
          : "${UPLOAD_STORE_PASSWORD:?Missing STOREPASS}"
          : "${UPLOAD_KEY_PASSWORD:?Missing KEYPASS}"
          : "${UPLOAD_ALIAS:?Missing KEYALIAS}"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gatto-upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/gatto-upload.jks" -storepass "$UPLOAD_STORE_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 -signedjar GattoGiudice_V16_Play_Firmato.aab android/app/build/outputs/bundle/release/app-release.aab "$UPLOAD_ALIAS"
          jarsigner -verify GattoGiudice_V16_Play_Firmato.aab
          unzip -t GattoGiudice_V16_Play_Firmato.aab | tail -1
          rm -f "$RUNNER_TEMP/gatto-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: GattoGiudice_V16_AAB_Play_Firmato
          path: app-source/GattoGiudice_V16_Play_Firmato.aab
          if-no-files-found: error
