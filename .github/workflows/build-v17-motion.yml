name: Gatto Giudice V17 - APK e AAB movimenti
on:
  workflow_dispatch:
  push:
    branches: [gatto-v17-motion]
    paths:
      - 'v17/**'
      - '.github/workflows/build-v17-motion.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Estrai V16 approvata e inserisci i movimenti V17
        run: |
          set -euo pipefail
          mkdir app-source
          unzip -q GattoGiudice_PLAY_V16_SORGENTI_BUILD_AAB.zip -d app-source
          cp v17/www/movimento-v17.css v17/www/movimento-v17.js app-source/www/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app-source/www/index.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="styles.css?v=play16">'
          assert old in s
          s=s.replace(old,old+'\n  <link rel="stylesheet" href="movimento-v17.css?v=17">')
          old='<script src="premium-bundle.js?v=play16"></script>'
          assert old in s
          s=s.replace(old,'<script src="movimento-v17.js?v=17"></script>\n '+old)
          p.write_text(s)
          assert s.count('movimento-v17.css')==1 and s.count('movimento-v17.js')==1
          PY
          # Assicura che la compilazione avvenga con il sorgente originale V16 e
          # solo le due nuove risorse animate (nessuna fotografia sostituita).
          test -f app-source/www/img/gatto-ironico.png
          test -f app-source/www/img/gatto-corrotto-approvato.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara SDK Android 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Installa e verifica sorgente e costruisci APK e AAB
        working-directory: app-source
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:play
          grep -q 'data-position="center"' www/movimento-v17.css
          grep -q 'prefers-reduced-motion' www/movimento-v17.css
          grep -q 'visibilitychange' www/movimento-v17.js
          npx cap add android
          npx cap sync android
          bash scripts/prepare-android-play.sh
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*22/minSdkVersion = 24/' android/variables.gradle
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 4/' android/app/build.gradle
          sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.3"/' android/app/build.gradle
          grep 'minSdkVersion = 24' android/variables.gradle
          grep 'versionCode 4' android/app/build.gradle
          grep 'versionName "1.0.3"' android/app/build.gradle
          # Risorse iconografiche duplicate impedirebbero a Gradle di compilare.
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source="android/app/src/main/res/mipmap-${density}-v4"
            target="android/app/src/main/res/mipmap-${density}"
            if [ -d "$source" ]; then
              mkdir -p "$target"
              cp -f "$source"/*.png "$target"/
              rm -rf "$source"
            fi
          done
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Firma e verifica APK e AAB
        working-directory: app-source
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.SIGNKEY }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.STOREPASS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.KEYPASS }}
          UPLOAD_ALIAS: ${{ secrets.KEYALIAS }}
        run: |
          set -euo pipefail
          : "${UPLOAD_KEYSTORE_B64:?Missing SIGNKEY}"
          : "${UPLOAD_STORE_PASSWORD:?Missing STOREPASS}"
          : "${UPLOAD_KEY_PASSWORD:?Missing KEYPASS}"
          : "${UPLOAD_ALIAS:?Missing KEYALIAS}"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gatto-v17-upload.jks"
          SDK_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk GattoGiudice_V17_Allineato.apk
          "$SDK_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/gatto-v17-upload.jks" --ks-key-alias "$UPLOAD_ALIAS" --ks-pass env:UPLOAD_STORE_PASSWORD --key-pass env:UPLOAD_KEY_PASSWORD --out GattoGiudice_V17_MOVIMENTO_NATURALE_ANDROID.apk GattoGiudice_V17_Allineato.apk
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs GattoGiudice_V17_MOVIMENTO_NATURALE_ANDROID.apk
          jarsigner -keystore "$RUNNER_TEMP/gatto-v17-upload.jks" -storepass "$UPLOAD_STORE_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 -signedjar GattoGiudice_V17_MOVIMENTO_NATURALE_PLAY.aab android/app/build/outputs/bundle/release/app-release.aab "$UPLOAD_ALIAS"
          jarsigner -verify GattoGiudice_V17_MOVIMENTO_NATURALE_PLAY.aab
          unzip -t GattoGiudice_V17_MOVIMENTO_NATURALE_PLAY.aab | tail -1
          rm -f "$RUNNER_TEMP/gatto-v17-upload.jks" GattoGiudice_V17_Allineato.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GattoGiudice_V17_APK_e_AAB_Firmati
          path: |
            app-source/GattoGiudice_V17_MOVIMENTO_NATURALE_ANDROID.apk
            app-source/GattoGiudice_V17_MOVIMENTO_NATURALE_PLAY.aab
          if-no-files-found: error
