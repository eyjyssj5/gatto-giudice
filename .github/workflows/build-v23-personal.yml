name: Gatto Giudice V23 - APK Personale Sei Gatti
on:
  workflow_dispatch:
  push:
    branches: [gatto-v23-personale-apk]
    paths:
      - 'v23/**'
      - '.github/workflows/build-v23-personal.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sorgente approvato
        run: |
          set -euo pipefail
          mkdir app-source
          unzip -q GattoGiudice_PLAY_V16_SORGENTI_BUILD_AAB.zip -d app-source
          test -f app-source/www/img/gatto-dolce-approvato.png
          test -f app-source/www/img/gatto-ironico.png
          test -f app-source/www/img/gatto-corrotto-approvato.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Test e compila APK AAB
        run: |
          set -euo pipefail
          cd app-source
          npm install --no-audit --no-fund
          npm test
          cd ..
          python3 v18/patch-v18.py
          python3 -m pip install -q "numpy<3" pillow opencv-python-headless
          python3 v21/build-motion.py --source app-source/www/img --output app-source/www/img
          python3 v20/patch.py
          python3 v22/patch-v22.py --edition personal
          python3 v23/genera-gatti.py --source app-source/www/img --output app-source/www/img
          python3 v23/patch.py
          python3 - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          src=Path('v21/build-motion.py').read_text()
          assert 'amount=blink' not in src and 'def blink' not in src
          for cat in ('dolce','severo','ironico','corrotto','pigro','supremo'):
            p=Path('app-source/www/img')/('gatto-'+cat+'-animato.webp')
            im=Image.open(p)
            assert im.n_frames>=36,(cat,im.n_frames)
            im.seek(0);a=np.array(im.convert('RGB'),dtype=np.int16)
            im.seek(im.n_frames//4);b=np.array(im.convert('RGB'),dtype=np.int16)
            delta=np.abs(a-b)
            assert delta.mean()>.1,(cat,delta.mean())
            # WebP compression causes minor changes even in still backgrounds.
            assert delta[0:20,0:20].mean()<20.0,(cat,'unexpected background difference')
            print('ANIMATION OK',cat,im.n_frames,round(float(delta.mean()),3))
          PY
          cd app-source
          node --check www/app.js
          node --check www/checkin-v18.js
          node --check www/checkin-ui-v18.js
          node --check www/movimento-v17.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const C=require('./www/checkin-v18.js');
          const memory=()=>{let m=new Map();return{getItem:k=>m.get(k)||null,setItem:(k,v)=>m.set(k,v)}};
          const day=n=>new Date(Date.UTC(2026,0,n,12)).toISOString().slice(0,10);
          let st=memory();
          for(let i=1;i<=18;i++)C.checkIn(day(i),st);
          assert.equal(C.owned('severo',st),true);
          assert.equal(C.progress(day(18),st).streak,8);
          assert.equal(C.progress(day(20),st).count,10);
          assert.equal(C.checkIn(day(20),st).count,11);
          assert.equal(C.owned('severo',st),true);
          assert.equal(C.owned('supremo',st),false);
          st=memory();
          for(let i=1;i<=40;i++)C.checkIn(day(i),st);
          for(let j of ['severo','ironico','corrotto','pigro'])assert.equal(C.owned(j,st),true);
          assert.equal(C.owned('supremo',st),false);
          for (const n of [2,8,9,12,18,19,22,28,29,32,38,39]) {
            const s=memory();
            for(let i=1;i<=n;i++) C.checkIn(day(i),s);
            const prior=C.progress(day(n),s);
            const missed=C.progress(day(n+2),s);
            assert.equal(missed.unlocked,prior.unlocked);
            assert.equal(missed.streak,0);
            assert.equal(missed.count,prior.unlocked);
            assert.equal(C.checkIn(day(n+2),s).count,prior.unlocked+1);
          }
          console.log('PASS: 12 esempi arbitrari di giorni saltati, 4 premi e Supremo abbonamento');
          NODE
          grep -q 'animation:none' www/movimento-v17.css
          grep -q 'gatto-.*-animato.webp' www/app.js
          for cat in dolce severo ironico corrotto pigro supremo; do test -s "www/img/gatto-$cat-animato.webp"; done
          grep -q 'cat-preview-tip' www/index.html
          if [ "personal" = personal ]; then
            grep -q 'function paid(id){return true;}' www/app.js
            grep -q 'com.aivevia.gattogiudice.personale' capacitor.config.json
          else
            grep -q 'GattoCheckin?.owned' www/app.js
          fi
          grep -q 'function playJudgeMotion(id)' www/app.js
          grep -q 'data-static' www/app.js
          grep -q 'data-anim' www/app.js
          grep -q '1420' www/app.js
          grep -q 'gatto-'+id+'-animato.webp' www/app.js || grep -q 'id+"-animato.webp?v=23' www/app.js
          grep -q 'img/gatto-'+JUDGES www/app.js || true
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for cat in ['dolce','severo','ironico','corrotto','pigro','supremo']:
            a=Path('www/img')/('gatto-'+cat+'-animato.webp')
            b=Path('www/img')/('gatto-'+cat+'-static.webp')
            assert Image.open(a).n_frames>=14
            assert Image.open(b).n_frames==1
          print('V23: 6 animated + 6 static validated')
          PY
          grep -q 'playJudgeMotion(selected)' www/app.js
          ! grep -q 'const animated=pos==="center"' www/app.js
          npm run build:premium
          npx cap add android
          npx cap sync android
          bash scripts/prepare-android-play.sh
          sed -i -E 's/minSdkVersion[[:space:]]*=[[:space:]]*22/minSdkVersion = 24/' android/variables.gradle
          if [ "personal" = personal ]; then
            sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' android/app/build.gradle
            sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.1"/' android/app/build.gradle
            grep -q 'com.aivevia.gattogiudice.personale' android/app/build.gradle
          else
            sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 8/' android/app/build.gradle
            sed -i -E 's/versionName[[:space:]]+"[^"]+"/versionName "1.0.7"/' android/app/build.gradle
            grep -q 'versionCode 8' android/app/build.gradle
          fi
          grep 'minSdkVersion = 24' android/variables.gradle
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            source="android/app/src/main/res/mipmap-$density-v4"
            target="android/app/src/main/res/mipmap-$density"
            if [ -d "$source" ]; then mkdir -p "$target"; cp -f "$source"/*.png "$target"/; rm -rf "$source"; fi
          done
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Firma e verifica APK AAB
        working-directory: app-source
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.SIGNKEY }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.STOREPASS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.KEYPASS }}
          UPLOAD_ALIAS: ${{ secrets.KEYALIAS }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEYSTORE_B64"
          test -n "$UPLOAD_STORE_PASSWORD"
          test -n "$UPLOAD_KEY_PASSWORD"
          test -n "$UPLOAD_ALIAS"
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gatto-v18.jks"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/gatto-v18.jks" --ks-key-alias "$UPLOAD_ALIAS" --ks-pass env:UPLOAD_STORE_PASSWORD --key-pass env:UPLOAD_KEY_PASSWORD --out GattoGiudice_V23_PERSONALE_ANDROID.apk unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs GattoGiudice_V23_PERSONALE_ANDROID.apk
          # La verifica deve passare con la chiave di upload originale, non una nuova.
          unzip -t GattoGiudice_V23_PERSONALE_ANDROID.apk | tail -1
          jarsigner -keystore "$RUNNER_TEMP/gatto-v18.jks" -storepass "$UPLOAD_STORE_PASSWORD" -keypass "$UPLOAD_KEY_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 -signedjar GattoGiudice_V23_PERSONALE_PLAY.aab android/app/build/outputs/bundle/release/app-release.aab "$UPLOAD_ALIAS"
          jarsigner -verify GattoGiudice_V23_PERSONALE_PLAY.aab
          unzip -t GattoGiudice_V23_PERSONALE_PLAY.aab | tail -1
          rm -f "$RUNNER_TEMP/gatto-v18.jks" unsigned-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GattoGiudice_V23_PERSONALE_APK_AAB_FIRMATI
          path: |
            app-source/GattoGiudice_V23_PERSONALE_ANDROID.apk
            app-source/GattoGiudice_V23_PERSONALE_PLAY.aab
          if-no-files-found: error
