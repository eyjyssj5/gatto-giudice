name: Pubblica Privacy Gatto Giudice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/privacy/**'
      - '.github/workflows/deploy-privacy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload privacy site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy privacy site
        id: deployment
        uses: actions/deploy-pages@v4
