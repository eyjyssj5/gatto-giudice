<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il gatto giudice</title>
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main>
    <h1 id="titolo">Il gatto giudice</h1>
    <div class="lingua-bar">
      <label id="lingua-label" for="lingua">Lingua</label>
      <select id="lingua" aria-label="Lingua / Language">
        <option value="it">🇮🇹 Italiano</option>
        <option value="es">🇪🇸 Español</option>
        <option value="en">🇬🇧 English</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="pl">🇵🇱 Polski</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>

    <div id="gatto-figura" class="gatto-figura" data-carattere="dolce">
      <img class="gatto-img" id="gatto" alt="Il gatto" src="img/gatto-dolce-esatto.webp">
      <canvas id="gatto-animato" class="gatto-canvas" aria-hidden="true"></canvas>
    </div>
    <div class="fumetto" id="fumetto" aria-live="polite">Scrivi una decisione di oggi e vediamo cosa ne penso.</div>

    <button type="button" id="btn-voce" hidden>🔊 Ascolta la sentenza</button>
    <p id="voce-info" class="voce-info"></p>
    <p id="stato-voce" class="stato-voce" role="status" aria-live="polite"></p>

    <div class="carattere">
      <button type="button" class="car" data-carattere="dolce">Dolce</button>
      <button type="button" class="car" data-carattere="severo">Severo</button>
      <button type="button" class="car" data-carattere="ironico">Ironico</button>
    </div>

    <form id="form-decisione">
      <input id="decisione" type="text" maxlength="120" placeholder="Es. Ho deciso di andare in palestra" required>
      <button type="submit" id="btn-giudica">Consegna al gatto</button>
    </form>

    <p class="contatore" id="contatore"></p>
    <div class="esito" id="esito" hidden>
      <span class="pollice" id="pollice"></span>
      <p id="esito-frase"></p>
    </div>

    <h2 id="titolo-oggi">Le decisioni di oggi</h2>
    <ul class="lista" id="lista-oggi"></ul>

    <h2 id="titolo-settimana">Ultimi 7 giorni</h2>
    <p id="riepilogo"></p>
  </main>
  <script src="i18n.js?v=9"></script>
  <script src="frasi.js"></script>
  <script src="lib.js"></script>
  <script src="animazione.js?v=6"></script>
  <script src="voce.js?v=10"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
