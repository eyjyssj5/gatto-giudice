<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimulaEsame">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07172f">
<meta name="description" content="SimulaEsame per iPhone - anteprima installabile da Safari">
<title>SimulaEsame</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  html, body { height: 100%; padding: 0; margin: 0; overflow: hidden; background: #07172f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  #screen { position: fixed; inset: 0; }
  #app { display: block; width: 100%; height: 100%; border: none; background: #07172f; }
  #loading { position: absolute; z-index: 2; inset: 0; display:flex; flex-direction: column; justify-content:center; align-items:center; gap:16px; background: #07172f; color:#f5fbff; text-align:center; padding:30px; }
  .logo { height:88px; width:88px; display:grid; place-items:center; background:linear-gradient(145deg,#2584d0,#093469); border:2px solid #55ddff; border-radius:24px; font-size:59px; font-weight:900; box-shadow:0 20px 70px #0007; }
  .hint { font-size:13px; color:#9dc8df; }
  #fallback { display:none; color:#c5ebff; padding:10px; border:1px solid #3b82ba; border-radius:9px; text-decoration:none; }
</style>
</head>
<body>
<main id="screen">
 <div id="loading" role="status" aria-label="Avvio SimulaEsame"><div class="logo">S</div><strong>SimulaEsame</strong><span class="hint">Caricamento dell'app per iPhone</span><a id="fallback" href="https://aivevia.com/simulaesame-web-v116/">Apri l'app</a></div>
 <iframe id="app" title="SimulaEsame - Test e Quiz" src="https://aivevia.com/simulaesame-web-v116/" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script>
  const loading=document.getElementById('loading');
  const fallback=document.getElementById('fallback');
  const frame=document.getElementById('app');
  frame.addEventListener('load',()=>{loading.style.display='none';});
  setTimeout(()=>{if(loading.style.display!=='none')fallback.style.display='block'},7000);
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}
</script>
</body>
</html>
